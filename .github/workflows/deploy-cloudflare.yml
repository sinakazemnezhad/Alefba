name: Alefbâ deploy Cloudflare (standalone)

on:
  push:
    branches: [main]
    paths:
      - "workspace/public/**"
      - "workspace/deploy/alefba-edge/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

jobs:
  deploy-edge:
    runs-on: ubuntu-latest
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    defaults:
      run:
        working-directory: workspace/deploy/alefba-edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install wrangler
        run: npm install
      - name: Deploy alefba Worker + Pages assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Note
        if: vars.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Set repository variable CLOUDFLARE_ACCOUNT_ID and secret CLOUDFLARE_API_TOKEN (Alefbâ standalone CF account)."
