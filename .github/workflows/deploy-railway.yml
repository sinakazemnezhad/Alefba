name: Alefbâ deploy Railway

on:
  push:
    branches: [main]
    paths:
      - "workspace/**"
      - "ALEFBA.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository != '' && vars.RAILWAY_SERVICE_ID != ''
    defaults:
      run:
        working-directory: workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy to Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: f4618103-6fd6-4fae-9b5e-4da129f41fba
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
        run: |
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --detach
      - name: Note
        if: vars.RAILWAY_SERVICE_ID == ''
        run: |
          echo "Set repository variable RAILWAY_SERVICE_ID and secret RAILWAY_TOKEN to enable deploy."
